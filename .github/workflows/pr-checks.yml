name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  python-lint:
    name: Python Linting (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 ingestion/src/ --count --max-line-length=120 --show-source --statistics

  terraform-checks:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init & Plan
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cd terraform/environments/dev
          terraform init -input=false -backend-config="bucket=${GCP_PROJECT_ID}-tf-state" -reconfigure
          terraform plan -input=false \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="raw_bucket_name=${GCP_PROJECT_ID}-raw-landing" \
            -var="docker_image=us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/olist-dataops-repo/ingestion:latest" \
            -var="github_repo=${{ github.repository }}"

  dbt-checks:
    name: dbt Validation (Compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: dbt Dependencies
        run: |
          dbt deps --project-dir dbt_olist --profiles-dir dbt_olist

      - name: dbt Compile
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          dbt compile --project-dir dbt_olist --profiles-dir dbt_olist
