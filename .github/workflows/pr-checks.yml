name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  PROJECT_ID: olist-dataops-73908
  REGION: us-central1

jobs:
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 ingestion/src/ --count --max-line-length=120 --show-source --statistics

  terraform-checks:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/

      - name: Terraform Validate
        run: |
          cd terraform/environments/dev
          terraform init -backend=false -input=false
          terraform validate

      - name: Authenticate to GCP via WIF
        if: env.WIF_PROVIDER != '' && env.WIF_SA != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Terraform Plan
        if: env.WIF_PROVIDER != '' && env.WIF_SA != ''
        run: |
          cd terraform/environments/dev
          terraform init -input=false -backend-config="bucket=${PROJECT_ID}-tf-state" -reconfigure || terraform init -input=false -backend=false
          terraform plan -input=false \
            -var="project_id=${PROJECT_ID}" \
            -var="raw_bucket_name=${PROJECT_ID}-raw-bronze" \
            -var="docker_image=us-central1-docker.pkg.dev/${PROJECT_ID}/olist-dataops-repo/ingestion:latest" \
            -var="github_repo=${{ github.repository }}"

  dbt-checks:
    name: dbt Validation
    runs-on: ubuntu-latest
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      - name: dbt Parse (Syntax & Jinja check)
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          dbt parse --project-dir dbt_olist --profiles-dir dbt_olist

      - name: Authenticate to GCP via WIF
        if: env.WIF_PROVIDER != '' && env.WIF_SA != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}
          export_environment_variables: true

      - name: dbt Compile
        if: env.WIF_PROVIDER != '' && env.WIF_SA != ''
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          dbt compile --project-dir dbt_olist --profiles-dir dbt_olist
