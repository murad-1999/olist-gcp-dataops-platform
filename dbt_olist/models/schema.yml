version: 2

models:
  # Staging Models (Silver Layer)
  - name: stg_olist_orders
    description: "Cleaned and typed Olist orders staging view"
    columns:
      - name: order_id
        description: "Primary key of the order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier associated with the order"
        tests:
          - not_null

  - name: stg_olist_customers
    description: "Cleaned and typed Olist customers staging view"
    columns:
      - name: customer_id
        description: "Primary key of the customer record"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier for the customer"
        tests:
          - not_null

  - name: stg_olist_order_items
    description: "Cleaned and typed Olist order items staging view"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: order_item_id
        description: "Sequential item number within order"
        tests:
          - not_null
      - name: product_id
        description: "Product identifier"
        tests:
          - not_null
      - name: seller_id
        description: "Seller identifier"
        tests:
          - not_null

  - name: stg_olist_order_payments
    description: "Cleaned and typed Olist order payments staging view"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: payment_sequential
        description: "Sequence number of payment"
        tests:
          - not_null

  - name: stg_olist_order_reviews
    description: "Cleaned and typed Olist order reviews staging view"
    columns:
      - name: review_id
        description: "Review identifier"
        tests:
          - not_null
      - name: order_id
        description: "Associated order identifier"
        tests:
          - not_null

  - name: stg_olist_products
    description: "Cleaned and typed Olist products staging view"
    columns:
      - name: product_id
        description: "Primary key of the product"
        tests:
          - unique
          - not_null

  - name: stg_olist_sellers
    description: "Cleaned and typed Olist sellers staging view"
    columns:
      - name: seller_id
        description: "Primary key of the seller"
        tests:
          - unique
          - not_null

  - name: stg_olist_geolocation
    description: "Cleaned and typed Olist geolocation staging view"
    columns:
      - name: geolocation_zip_code_prefix
        description: "Zip code prefix"
        tests:
          - not_null

  - name: stg_olist_product_category_translation
    description: "Product category name translation mapping view"
    columns:
      - name: product_category_name
        description: "Portuguese product category name"
        tests:
          - unique
          - not_null

  # Mart Models (Gold Layer - Star Schema)
  - name: fact_orders
    description: "Fact table containing order level transactions, metrics, and timestamps. Partitioned by order_purchase_timestamp and clustered by customer_id."
    columns:
      - name: order_id
        description: "Primary key for the order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customer record"
        tests:
          - not_null

  - name: fact_order_payments
    description: "Fact table containing payment lines per order. Partitioned by order_purchase_timestamp and clustered by order_id."
    columns:
      - name: payment_id
        description: "Composite surrogate primary key (order_id + payment_sequential)"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fact_orders"
        tests:
          - not_null

  - name: fact_order_reviews
    description: "Fact table containing customer satisfaction reviews. Partitioned by order_purchase_timestamp and clustered by order_id."
    columns:
      - name: review_order_id
        description: "Composite surrogate primary key (review_id + order_id)"
        tests:
          - unique
          - not_null
      - name: review_id
        description: "Review identifier"
        tests:
          - not_null
      - name: order_id
        description: "Foreign key to fact_orders"
        tests:
          - not_null

  - name: dim_customers
    description: "Dimension table representing unique customers. Clustered by customer_unique_id."
    columns:
      - name: customer_unique_id
        description: "Unique identifier for the customer (Primary Key)"
        tests:
          - unique
          - not_null

  - name: dim_sellers
    description: "Dimension table representing merchants and sellers. Clustered by seller_id."
    columns:
      - name: seller_id
        description: "Unique identifier for the seller (Primary Key)"
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Dimension table representing products with category translations and physical specs. Clustered by product_id."
    columns:
      - name: product_id
        description: "Unique identifier for the product (Primary Key)"
        tests:
          - unique
          - not_null

  - name: dim_geolocation
    description: "Dimension table representing geographical centroids by postal code prefix. Clustered by geolocation_zip_code_prefix."
    columns:
      - name: geolocation_zip_code_prefix
        description: "Five-digit zip code prefix (Primary Key)"
        tests:
          - unique
          - not_null
