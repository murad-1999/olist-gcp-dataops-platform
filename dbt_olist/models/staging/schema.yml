version: 2

models:
  - name: stg_olist_orders
    description: "Cleaned, deduplicated, and typed Olist orders staging view in olist_silver"
    columns:
      - name: order_id
        description: "Primary key of the order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier associated with the order"
        tests:
          - not_null

  - name: stg_olist_customers
    description: "Cleaned and typed Olist customers staging view in olist_silver"
    columns:
      - name: customer_id
        description: "Primary key of the customer record"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier representing the customer"
        tests:
          - not_null

  - name: stg_olist_order_items
    description: "Cleaned and typed Olist order items staging view in olist_silver"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: order_item_id
        description: "Sequential item number within order"
        tests:
          - not_null
      - name: product_id
        description: "Product identifier"
        tests:
          - not_null
      - name: seller_id
        description: "Seller identifier"
        tests:
          - not_null

  - name: stg_olist_order_payments
    description: "Cleaned and typed Olist order payments staging view in olist_silver"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: payment_sequential
        description: "Sequence number of payment"
        tests:
          - not_null

  - name: stg_olist_order_reviews
    description: "Cleaned and typed Olist order reviews staging view in olist_silver"
    columns:
      - name: review_id
        description: "Review identifier"
        tests:
          - not_null
      - name: order_id
        description: "Associated order identifier"
        tests:
          - not_null

  - name: stg_olist_products
    description: "Cleaned and typed Olist products staging view in olist_silver"
    columns:
      - name: product_id
        description: "Primary key of the product"
        tests:
          - unique
          - not_null

  - name: stg_olist_sellers
    description: "Cleaned and typed Olist sellers staging view in olist_silver"
    columns:
      - name: seller_id
        description: "Primary key of the seller"
        tests:
          - unique
          - not_null

  - name: stg_olist_geolocation
    description: "Cleaned and typed Olist geolocation staging view in olist_silver"
    columns:
      - name: geolocation_zip_code_prefix
        description: "Zip code prefix"
        tests:
          - not_null

  - name: stg_olist_product_category_translation
    description: "Product category name translation mapping view in olist_silver"
    columns:
      - name: product_category_name
        description: "Portuguese product category name"
        tests:
          - unique
          - not_null
